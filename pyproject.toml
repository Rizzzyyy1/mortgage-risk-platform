[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mortgage-risk-platform"
version = "0.1.0"
description = "Mortgage credit risk and stress testing platform"
readme = "README.md"
requires-python = ">=3.11, <3.15"
authors = [
    { name = "Rizwan Ahmmed" },
]
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "PyYAML>=6.0.1",
    "duckdb>=1.5.5",
    "scikit-learn==1.9.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pip-tools>=7.0.0",
]

[project.scripts]
mortgage-risk = "mortgage_risk.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["vendor_data: optional integration test requiring a locally acquired vendor sample"]
